  /reset:
    post:
      summary: Reset do sistema
      description: |
        Reseta o estado do sistema, limpando todas as contas e transações.

        **⚠️ ATENÇÃO**: Esta operação é destrutiva e não pode ser desfeita.
        Use apenas em ambientes de desenvolvimento/teste.

        Requer autenticação JWT.
      tags:
        - bank
      operationId: resetSystem
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sistema resetado com sucesso
          content:
            application/json:
              schema:
                type: string
              example: OK
        '401':
          description: Não autorizado - Token JWT inválido ou ausente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication error
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Internal server error
