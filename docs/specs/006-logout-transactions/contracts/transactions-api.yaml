openapi: 3.0.3
info:
  title: Transactions History API
  description: API para consulta de histórico de transações do usuário autenticado
  version: 1.0.0
  contact:
    name: Backend Team

servers:
  - url: http://localhost:3333
    description: Servidor de desenvolvimento
  - url: https://api.lwfinancial.com
    description: Servidor de produção

paths:
  /v1/transactions:
    get:
      summary: Consultar histórico de transações
      description: |
        Endpoint para consultar o histórico de transações do usuário autenticado.
        Retorna as 20 transações mais recentes ordenadas por data de criação (mais recente primeiro).

        Requisitos:
        - Autenticação obrigatória via JWT token
        - Identificação automática do usuário via token JWT
        - Limite fixo de 20 transações
        - Ordenação por createdAt DESC (mais recente primeiro)
      operationId: getTransactions
      tags:
        - Transactions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de transações do usuário autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Transaction'
              example:
                - id: 'clx1234567890abcdef'
                  type: 'DEPOSIT'
                  amount: '100.50'
                  originAccountId: null
                  destinationAccountId: 'clx9876543210fedcba'
                  userId: 'clx1111111111111111'
                  createdAt: '2025-12-03T14:30:00.000Z'
                - id: 'clx0987654321fedcba'
                  type: 'WITHDRAW'
                  amount: '50.00'
                  originAccountId: 'clx9876543210fedcba'
                  destinationAccountId: null
                  userId: 'clx1111111111111111'
                  createdAt: '2025-12-03T10:15:00.000Z'
        '401':
          description: Não autenticado - token JWT ausente ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Não autenticado'
        '403':
          description: Acesso negado - token JWT inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Token inválido ou expirado'
        '500':
          description: Erro interno do servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: 'Internal server error'

components:
  schemas:
    Transaction:
      type: object
      required:
        - id
        - type
        - amount
        - createdAt
      properties:
        id:
          type: string
          description: Identificador único da transação (cuid)
          example: 'clx1234567890abcdef'
        type:
          type: string
          enum:
            - DEPOSIT
            - WITHDRAW
            - TRANSFER
          description: Tipo da transação
          example: 'DEPOSIT'
        amount:
          type: string
          format: decimal
          description: Valor da transação com 2 casas decimais
          example: '100.50'
        originAccountId:
          type: string
          nullable: true
          description: ID da conta de origem (para saques e transferências)
          example: 'clx9876543210fedcba'
        destinationAccountId:
          type: string
          nullable: true
          description: ID da conta de destino (para depósitos e transferências)
          example: 'clx9876543210fedcba'
        userId:
          type: string
          nullable: true
          description: ID do usuário associado à transação
          example: 'clx1111111111111111'
        createdAt:
          type: string
          format: date-time
          description: Data e hora de criação da transação (ISO 8601)
          example: '2025-12-03T14:30:00.000Z'
      description: Representa uma transação bancária

    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Mensagem de erro
          example: 'Não autenticado'
      description: Resposta de erro padrão

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Autenticação via JWT token no header Authorization
