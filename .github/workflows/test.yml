name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lw-financial_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma Client
        working-directory: apps/backend
        run: bun run prisma:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lw-financial_test

      - name: Run database migrations
        working-directory: apps/backend
        run: bun run prisma:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lw-financial_test

      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lw-financial_test
          NODE_ENV: test
          BETTER_AUTH_SECRET: test-secret-key-min-32-characters-long-for-hs256

      - name: Run lint
        run: bun run lint

      - name: Run type check
        run: bun run type-check
